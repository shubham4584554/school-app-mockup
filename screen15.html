<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Academy — 15 Fee Payment</title>
<style>
:root{--bg:#090d20;--text:#f7f8ff;--muted:#aeb7d7;--line:rgba(255,255,255,.12);--a:#675cff;--b:#3f8eff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 18% 8%,rgba(103,92,255,.18),transparent 25%),radial-gradient(circle at 85% 90%,rgba(63,142,255,.13),transparent 23%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{height:68px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(9,13,32,.84);backdrop-filter:blur(16px);position:sticky;top:0;z-index:10}
.brand{font-weight:800;font-size:18px}.meta{font-size:12px;color:var(--muted)}.spacer{flex:1}
.btn,.chip{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;padding:9px 12px;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:11px;font-size:12px;font-weight:700}
.primary{background:linear-gradient(135deg,var(--a),var(--b));border-color:transparent}
main{max-width:1380px;margin:auto;padding:22px 18px 74px}h1{margin:0;font-size:28px}.sub{color:var(--muted);margin-top:5px;font-size:12px}
.panel{margin-top:18px;background:rgba(17,24,52,.84);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 28px 65px rgba(0,0,0,.38)}
.device{display:flex;justify-content:center}.phone{display:inline-flex;padding:7px;border-radius:38px;background:linear-gradient(145deg,#fff,#aab3ca 40%,#1a2141);box-shadow:0 26px 70px rgba(0,0,0,.48)}
.phone img{display:block;max-width:min(88vw,440px);max-height:77vh;width:auto;height:auto;object-fit:contain;border-radius:32px;background:#eef2ff}
.controls,.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}.count{font-weight:800;color:var(--muted);font-size:12px}
footer{position:fixed;bottom:0;left:0;right:0;height:50px;display:flex;align-items:center;justify-content:center;background:rgba(9,13,32,.92);border-top:1px solid var(--line);color:#9ea8c7;font-size:11px}
@media(max-width:650px){.meta{display:none}h1{font-size:22px}.phone img{max-height:70vh;max-width:94vw}}
</style></head>
