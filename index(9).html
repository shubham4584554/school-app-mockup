<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d4cff">
<title>The Academy — School App Demo</title>
<style>
:root{
  --bg:#f4f1ff;--surface:#ffffff;--surface2:#f8f7fc;--ink:#191725;--muted:#7c7890;
  --primary:#6d4cff;--primary2:#8f73ff;--accent:#ffad2f;--success:#2cb67d;--danger:#f45b69;
  --shadow:0 24px 70px rgba(57,44,120,.18);--shadow2:0 10px 28px rgba(44,34,84,.10);
  --r:24px;--line:#ebe8f4;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:
radial-gradient(circle at 15% 10%,rgba(143,115,255,.18),transparent 28%),
radial-gradient(circle at 88% 20%,rgba(255,173,47,.16),transparent 26%),#f2effa;color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app-wrap{min-height:100vh;display:flex;flex-direction:column}
.demo-bar{height:62px;display:flex;align-items:center;justify-content:center;gap:14px;padding:8px 16px;background:#161226;color:#fff;position:sticky;top:0;z-index:80}
.demo-inner{width:min(1180px,100%);display:flex;align-items:center;justify-content:space-between;gap:12px}
.demo-brand{display:flex;align-items:center;gap:10px}.demo-brand .mini-logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#a58aff,#5b3bff);display:grid;place-items:center;font-weight:800}
.demo-brand b{font-size:13px}.demo-brand span{display:block;font-size:9px;color:#a7a1bb}
.demo-actions{display:flex;align-items:center;gap:8px}
.role-tabs{display:flex;background:rgba(255,255,255,.08);padding:4px;border-radius:12px;gap:3px}
.role-tabs button{border:0;background:transparent;color:#ddd7ef;padding:7px 9px;border-radius:9px;font-size:10px}
.role-tabs button.active{background:#fff;color:#3f2d80;font-weight:800}
.demo-btn{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;padding:8px 10px;border-radius:10px;font-size:10px}
.demo-note{display:none;font-size:9px;color:#b8b2c8}
.stage{flex:1;display:grid;place-items:center;padding:30px}
.phone{width:min(405px,96vw);height:min(820px,calc(100vh - 120px));background:#0f0c19;border-radius:42px;padding:12px;box-shadow:var(--shadow);position:relative}
.phone:before{content:"";position:absolute;left:50%;top:8px;transform:translateX(-50%);width:110px;height:23px;border-radius:15px;background:#07060b;z-index:50}
.screen{height:100%;border-radius:31px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;position:relative}
.status{height:30px;padding:7px 17px 0;display:flex;justify-content:space-between;font-size:10px;font-weight:800;z-index:5}
.view{flex:1;overflow:auto;padding-bottom:78px;scroll-behavior:smooth}.view::-webkit-scrollbar{display:none}
.screen-header{display:flex;align-items:center;justify-content:space-between;padding:8px 17px 12px;position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);z-index:20}
.back,.icon-btn{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:#524c63}
.brand-lockup{display:flex;align-items:center;gap:9px}.brand-mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#8f73ff,#5f42f0);color:#fff;display:grid;place-items:center;font-weight:800;box-shadow:0 7px 18px rgba(109,76,255,.22)}
.brand-text b{font-size:11px}.brand-text span{display:block;font-size:8px;color:var(--muted);margin-top:1px}
.bottom-nav{position:absolute;left:10px;right:10px;bottom:10px;height:63px;border-radius:20px;background:#151120;color:#d9d2e6;display:flex;align-items:center;justify-content:space-around;z-index:40;box-shadow:0 10px 30px rgba(15,11,29,.28)}
.bottom-nav button{flex:1;border:0;background:transparent;color:#bcb4ca;padding:6px 2px;font-size:8px;display:flex;flex-direction:column;align-items:center;gap:3px}
.bottom-nav button .bn-ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:13px}
.bottom-nav button.active{color:#fff}.bottom-nav button.active .bn-ic{background:#fff;color:#2f234b}
h1,h2,h3,p{margin:0}.page-title{padding:5px 18px 2px}.page-title h1{font-size:24px;letter-spacing:-.035em}.page-title p{font-size:9px;color:var(--muted);margin-top:3px}
.pad{padding:15px 17px}.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.hero{margin:10px 17px 0;border-radius:22px;padding:18px;color:#fff;background:linear-gradient(135deg,#6b4cff,#8d71ff 58%,#a183ff);position:relative;overflow:hidden;box-shadow:0 16px 34px rgba(109,76,255,.22)}
.hero:after{content:"";position:absolute;right:-35px;bottom:-55px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.24),transparent 65%)}
.hero .eyebrow{text-transform:uppercase;font-size:8px;letter-spacing:.16em;font-weight:800;opacity:.82}.hero h2{font-size:24px;margin-top:5px}.hero p{font-size:9px;line-height:1.5;max-width:280px;margin-top:6px;color:#f2efff}
.metrics{display:flex;gap:12px;margin-top:15px;flex-wrap:wrap}.metric{padding-right:12px;border-right:1px solid rgba(255,255,255,.20)}.metric:last-child{border-right:0}.metric b{display:block;font-size:16px}.metric span{font-size:8px;color:#e9e4ff}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px;box-shadow:var(--shadow2)}
.soft{background:#faf9fe}.section{display:flex;justify-content:space-between;align-items:center;padding:17px 17px 9px}.section b{font-size:12px}.section span{font-size:8px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 17px}.quick button{border:1px solid var(--line);background:#fff;border-radius:15px;padding:9px 4px;color:#4b445f;font-size:8px;box-shadow:var(--shadow2)}.quick .qic{width:34px;height:34px;border-radius:11px;background:#f0ebff;color:#6d4cff;display:grid;place-items:center;margin:0 auto 4px;font-size:13px}
.progress{height:7px;background:#efedf5;border-radius:999px;overflow:hidden}.progress span{height:100%;display:block;border-radius:999px;background:linear-gradient(90deg,#6d4cff,#9b7dff)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #f1eff6}.row:last-child{border-bottom:0}.row-main{display:flex;align-items:center;gap:9px}.avatar{width:33px;height:33px;border-radius:12px;background:linear-gradient(135deg,#ebe5ff,#faf8ff);display:grid;place-items:center;color:#5d43c9;font-weight:800;font-size:10px}.row b{font-size:10px}.row small{display:block;color:var(--muted);font-size:8px;margin-top:2px}
.chip{padding:5px 8px;border-radius:999px;font-size:8px;font-weight:800}.chip.good{background:#e8faf2;color:#16835e}.chip.warn{background:#fff4dc;color:#a26e06}.chip.bad{background:#ffecee;color:#be3d4b}.chip.blue{background:#ebeaff;color:#5340c5}
.stat{display:flex;align-items:center;justify-content:space-between}.stat b{font-size:20px}.stat span{font-size:8px;color:var(--muted)}
.bar-chart{height:130px;display:flex;align-items:flex-end;gap:7px;padding:8px 2px}.bar{flex:1;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,#9a84ff,#6d4cff);min-width:8px}
.donut{width:108px;height:108px;border-radius:50%;background:conic-gradient(#6d4cff 0 92%,#eceaf3 92%);display:grid;place-items:center}.donut:after{content:"";width:75px;height:75px;border-radius:50%;background:#fff}.donut-wrap{display:flex;align-items:center;gap:15px}.donut-value{margin-left:-101px;z-index:2;font-size:18px;font-weight:800}.legend{font-size:8px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:5px}.dot{width:7px;height:7px;border-radius:50%}
.searchbox{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#faf9fd;border-radius:14px;padding:9px 11px;margin:10px 17px}.searchbox input{border:0;outline:0;background:transparent;width:100%;font-size:9px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:8px;text-align:center}.cal-head{color:var(--muted);padding:3px}.cal-day{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;margin:auto}.cal-day.active{background:#181324;color:#fff;border-color:#181324}.cal-day.good{background:#e7faf2;color:#16835e;border-color:#d2f5e7}.cal-day.bad{background:#ffecee;color:#be3d4b;border-color:#ffd8dc}
.lesson{display:flex;gap:10px;padding:9px 0}.lesson-time{width:45px;font-size:8px;color:var(--muted)}.lesson-card{flex:1;border-left:3px solid #6d4cff;padding:9px 10px;border-radius:10px;background:#faf9ff}.lesson-card b{font-size:10px}.lesson-card small{font-size:8px;color:var(--muted)}
.assignment{padding:10px;border-radius:14px;background:#faf9ff;border:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}.assignment b{font-size:10px}.assignment small{font-size:8px;color:var(--muted);display:block;margin-top:3px}
.cover{height:120px;border-radius:16px;background:linear-gradient(135deg,#7b60ff,#a28cff);color:#fff;padding:15px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}.cover:before{content:"";position:absolute;width:140px;height:140px;border-radius:50%;right:-35px;top:-35px;background:rgba(255,255,255,.15)}.cover b{font-size:17px;position:relative;z-index:1}.cover small{font-size:8px;opacity:.85;position:relative;z-index:1}
.detail-list .row{padding:12px 0}.detail-list b{font-size:11px}
.input{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;outline:0;font-size:10px;background:#fff}.field{margin-bottom:10px}.field label{display:block;font-size:8px;color:var(--muted);margin-bottom:4px}.primary{border:0;color:#fff;background:linear-gradient(135deg,#6d4cff,#8d70ff);padding:11px 14px;border-radius:12px;font-size:10px;font-weight:800;box-shadow:0 10px 20px rgba(109,76,255,.18)}.secondary{border:1px solid var(--line);color:#4e465e;background:#fff;padding:10px 13px;border-radius:12px;font-size:10px;font-weight:700}
.notice{padding:11px 12px;border-radius:14px;background:#f4f0ff;border:1px solid #e5ddff;color:#5542b0;font-size:9px}.danger-note{background:#fff0f2;border-color:#ffdce1;color:#b63b47}
.phone-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.phone-grid .card{padding:12px}
.profile-head{display:flex;align-items:center;gap:12px;padding:17px}.profile-avatar{width:63px;height:63px;border-radius:21px;background:linear-gradient(135deg,#e9e3ff,#fcfbff);display:grid;place-items:center;color:#5d44d0;font-size:18px;font-weight:900}
.timeline{position:relative;padding-left:18px}.timeline:before{content:"";position:absolute;left:5px;top:5px;bottom:5px;width:1px;background:#ddd8e8}.titem{position:relative;padding:0 0 12px 12px}.titem:before{content:"";position:absolute;left:-17px;top:4px;width:8px;height:8px;border-radius:50%;background:#6d4cff;box-shadow:0 0 0 4px #eee9ff}.titem b{font-size:9px}.titem small{display:block;color:var(--muted);font-size:8px;margin-top:2px}
.toast{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);background:#181323;color:#fff;padding:10px 14px;border-radius:12px;font-size:9px;display:none;z-index:60;box-shadow:0 12px 28px rgba(0,0,0,.25)}
.modal{position:absolute;inset:0;background:rgba(14,10,25,.48);display:none;align-items:flex-end;justify-content:center;z-index:55}.sheet{width:100%;background:#fff;border-radius:24px 24px 0 0;padding:18px;max-height:76%;overflow:auto;box-shadow:0 -20px 60px rgba(25,16,50,.18)}.sheet h3{font-size:16px;margin-bottom:6px}.sheet p{font-size:9px;color:var(--muted);margin-bottom:14px}.sheet-actions{display:flex;gap:8px;justify-content:flex-end}
.splash{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:linear-gradient(180deg,#fbf9ff,#f0ecff)}.splash-logo{width:94px;height:94px;border-radius:30px;background:linear-gradient(135deg,#9479ff,#5f41ef);display:grid;place-items:center;color:#fff;font-size:29px;font-weight:900;box-shadow:0 18px 40px rgba(109,76,255,.25);margin-bottom:18px}.splash h1{font-size:28px;letter-spacing:-.04em}.splash p{font-size:10px;color:var(--muted);margin-top:6px}.splash .school-image{height:180px;width:100%;margin-top:28px;border-radius:25px;background:linear-gradient(135deg,#dcd4ff,#fefcff);display:flex;align-items:center;justify-content:center;font-size:70px}
.role-screen{padding:22px}.role-screen h1{font-size:26px;letter-spacing:-.04em}.role-screen p{font-size:9px;color:var(--muted);margin-top:6px}.role-card{margin-top:11px;padding:13px;border:1px solid var(--line);border-radius:17px;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:var(--shadow2)}.role-card .left{display:flex;align-items:center;gap:10px}.role-ico{width:42px;height:42px;border-radius:14px;background:#f0ebff;color:#6d4cff;display:grid;place-items:center;font-size:16px}.role-card b{font-size:11px}.role-card small{font-size:8px;color:var(--muted);display:block;margin-top:2px}
.login-wrap{padding:20px}.login-wrap h1{font-size:24px}.login-wrap p{font-size:9px;color:var(--muted);margin-top:5px}.login-card{margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow2)}
.small-link{font-size:8px;color:#6348df}.otp{display:flex;gap:7px;margin:12px 0}.otp input{width:38px;text-align:center;padding:10px;border:1px solid var(--line);border-radius:11px}
.role-chip{padding:5px 8px;background:#f0ebff;color:#6147da;border-radius:999px;font-size:8px;font-weight:800}
@media(min-width:900px){.demo-note{display:block}.stage{padding:42px}.phone{width:415px}.demo-bar{height:68px}}
@media(max-width:600px){.demo-inner{justify-content:center}.demo-brand,.demo-note{display:none}.stage{padding:0}.phone{width:100vw;height:100vh;border-radius:0;padding:0;box-shadow:none}.screen{border-radius:0}.phone:before{display:none}}
</style>
</head>
<body>
<div class="app-wrap">
  <div class="demo-bar">
    <div class="demo-inner">
      <div class="demo-brand">
        <div class="mini-logo">TA</div>
        <div><b id="demoSchool">The Academy</b><span>Unified School App • Live Frontend Demo</span></div>
      </div>
      <div class="role-tabs" id="roleTabs">
        <button data-role="student">Student</button>
        <button data-role="parent">Parent</button>
        <button data-role="teacher">Teacher</button>
      </div>
      <div class="demo-actions">
        <button class="demo-btn" onclick="openScreen('account')">Account</button>
        <button class="demo-btn" onclick="resetDemo()">Reset</button>
      </div>
    </div>
  </div>

  <div class="stage">
    <div class="phone">
      <div class="screen">
        <div class="status"><span id="statusTime">9:41</span><span>▴ ◉ ▪</span></div>
        <div class="view" id="view"></div>
        <div class="toast" id="toast"></div>
        <div class="modal" id="modal"></div>
        <div class="bottom-nav" id="bottomNav"></div>
      </div>
    </div>
  </div>
</div>

<script>
const SCHOOL_CONFIG = {
  name: "The Academy",
  shortName: "The Academy",
  tagline: "Learn • Grow • Belong",
  accent: "#6d4cff",
  currency: "₹",
  location: "Main Campus"
};

const state = {
  role: "student",
  screen: "splash",
  child: "Aarav Sharma",
  toastTimer: null
};

const nav = {
  student: [
    ["home_student","⌂","Home"],["timetable","◫","Classes"],["homework","✓","Updates"],["results","◉","Results"],["profile_student","◌","Profile"]
  ],
  parent: [
    ["parent_home","⌂","Home"],["parent_child","◉","Children"],["parent_fee","₹","Fees"],["messages","✉","Messages"],["account","◌","Profile"]
  ],
  teacher: [
    ["teacher_home","⌂","Home"],["teacher_classes","▦","Classes"],["teacher_attendance","◷","Attendance"],["teacher_homework","✓","Work"],["teacher_marks","△","Marks"]
  ]
};

const screens = {
  splash(){ return `
    <div class="splash">
      <div class="splash-logo">TA</div>
      <h1>${SCHOOL_CONFIG.name}</h1>
      <p>${SCHOOL_CONFIG.tagline}</p>
      <div class="school-image">🏫</div>
      <div style="margin-top:26px;width:100%">
        <button class="primary" style="width:100%" onclick="openScreen('roles')">Get Started</button>
      </div>
      <small style="margin-top:11px;color:#9992aa;font-size:8px">Unified web app for students, parents and teachers</small>
    </div>`; },

  roles(){ return `
    <div class="role-screen">
      <div class="brand-lockup"><div class="brand-mark">TA</div><div class="brand-text"><b>${SCHOOL_CONFIG.name}</b><span>${SCHOOL_CONFIG.tagline}</span></div></div>
      <div style="margin-top:25px"><h1>How do you use the app?</h1><p>Choose your role to explore the experience.</p></div>
      <div class="role-card" onclick="chooseRole('student')"><div class="left"><div class="role-ico">🎓</div><div><b>I'm a Student</b><small>Classes, homework, results & study</small></div></div><span>›</span></div>
      <div class="role-card" onclick="chooseRole('parent')"><div class="left"><div class="role-ico">👨‍👩‍👧</div><div><b>I'm a Parent</b><small>Children, fees, notices & progress</small></div></div><span>›</span></div>
      <div class="role-card" onclick="chooseRole('teacher')"><div class="left"><div class="role-ico">🧑‍🏫</div><div><b>I'm a Teacher</b><small>Classes, attendance, homework & marks</small></div></div><span>›</span></div>
      <div class="card soft" style="margin-top:18px"><b style="font-size:10px">One app. Three role experiences.</b><p style="font-size:8px;color:var(--muted);margin-top:4px">The account controls which features and data are visible.</p></div>
    </div>`; },

  login(){ const labels = {student:"Student",parent:"Parent",teacher:"Teacher"}; return `
    <div class="login-wrap">
      <button class="back" onclick="openScreen('roles')">‹</button>
      <div style="margin-top:24px"><span class="role-chip">${labels[state.role]} Login</span><h1 style="margin-top:10px">Welcome back</h1><p>Sign in to continue to ${SCHOOL_CONFIG.name}.</p></div>
      <div class="login-card">
        <div class="field"><label>Mobile number / Email</label><input class="input" id="loginValue" value="98765 43210"></div>
        <button class="primary" style="width:100%" onclick="openScreen('otp')">Send OTP</button>
        <div style="text-align:center;margin-top:12px"><span class="small-link" onclick="showDemoToast('Password login selected')">Use password instead</span></div>
      </div>
      <div class="notice" style="margin-top:12px">Demo login: any number or email can proceed.</div>
    </div>`; },

  otp(){ return `
    <div class="login-wrap">
      <button class="back" onclick="openScreen('login')">‹</button>
      <div style="margin-top:25px"><span class="role-chip">Secure sign-in</span><h1 style="margin-top:10px">Enter OTP</h1><p>We sent a 6-digit code to <b>98765 43210</b>.</p></div>
      <div class="login-card"><div class="otp">${[1,2,3,4,5,6].map((_,i)=>`<input id="otp${i}" maxlength="1" oninput="focusNext(${i})">`).join('')}</div><button class="primary" style="width:100%" onclick="completeLogin()">Verify & Continue</button><div style="text-align:center;margin-top:13px;font-size:8px;color:var(--muted)">Resend in 00:25</div></div>
    </div>`; },

  home_student(){ return `
    <div class="hero"><div class="eyebrow">${SCHOOL_CONFIG.shortName} • Student</div><h2>Good morning, Aarav 👋</h2><p>Your day at a glance — classes, homework, results and school updates.</p><div class="metrics"><div class="metric"><b>92%</b><span>Attendance</span></div><div class="metric"><b>5</b><span>Pending tasks</span></div><div class="metric"><b>3</b><span>Upcoming exams</span></div></div></div>
    <div class="section"><b>Quick access</b><span>Everything in one place</span></div>
    <div class="quick">
      ${[
        ["timetable","◫","Timetable"],["homework","✓","Homework"],["lms","▣","Study"],["results","◉","Results"],
        ["attendance","◷","Attendance"],["fees","₹","Fees"],["notices","⌂","Notices"],["transport","⌁","Bus"]
      ].map(x=>`<button onclick="openScreen('${x[0]}')"><div class="qic">${x[1]}</div>${x[2]}</button>`).join("")}
    </div>
    <div class="section"><b>Today's classes</b><span>Tuesday • 16 Sep</span></div>
    <div class="pad"><div class="card">${lessons().slice(0,3).map(lessonHTML).join("")}</div></div>
    <div class="section"><b>Latest updates</b><span>See all</span></div>
    <div class="pad"><div class="card">${noticeRows().slice(0,3).map(noticeRow).join("")}</div></div>`; },

  timetable(){ return `
    ${header("Timetable","Class 10-A")}
    <div class="pad"><div class="calendar">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<div class="cal-head">${d}</div>`).join("")}
      ${["9","10","11","12","13","14","15"].map((d,i)=>`<div class="cal-day ${i===1?"active":i===3?"good":""}">${d}</div>`).join("")}
      ${["16","17","18","19","20","21","22"].map(d=>`<div class="cal-day">${d}</div>`).join("")}
    </div></div>
    <div class="section"><b>Tuesday • 16 Sep</b><span>6 classes</span></div>
    <div class="pad"><div class="card">${lessons().map(lessonHTML).join("")}</div></div>`; },

  homework(){ return `
    ${header("Homework","5 pending • 4 completed")}

    <div class="pad"><div class="grid g3"><button class="secondary">All</button><button class="secondary">School</button><button class="secondary">Direct</button></div>
    <div class="card" style="margin-top:11px">${[
      ["Ms. Kapoor","Parent of Aarav Sharma","PTM meeting at 1:00 PM","10:46 AM"],
      ["Mr. Sharma","Parent","Thank you for the feedback.","09:25 AM"],
      ["Class 10-A","School broadcast","Science Exhibition registration closes Friday.","Yesterday"]
    ].map(r=>`<div class="row"><div class="row-main"><div class="avatar">${initials(r[0])}</div><div><b>${r[0]}</b><small>${r[1]}</small><small>${r[2]}</small></div></div><small style="color:var(--muted)">${r[3]}</small></div>`).join("")}</div>
    <button class="primary" style="width:100%;margin-top:11px" onclick="openComposer()">＋ New Message</button></div>`; },

  account(){ return `
    ${header("Account","Switch role / profile")}
    <div class="pad"><div class="profile-head" style="padding:0 0 15px"><div class="profile-avatar">${state.role==="student"?"AS":state.role==="parent"?"MS":"NV"}</div><div><h2 style="font-size:17px">${state.role==="student"?"Aarav Sharma":state.role==="parent"?"Mr. Sharma":"Ms. Neha Verma"}</h2><div style="font-size:8px;color:var(--muted);margin-top:3px">${state.role.charAt(0).toUpperCase()+state.role.slice(1)} account</div></div></div>
    <div class="card">${[
      ["Student account","Aarav Sharma","student"],
      ["Parent account","Mr. Sharma","parent"],
      ["Teacher account","Ms. Neha Verma","teacher"]
    ].map(r=>`<div class="row" onclick="chooseRole('${r[2]}')"><div class="row-main"><div class="avatar">${r[2]==='student'?'AS':r[2]==='parent'?'MS':'NV'}</div><div><b>${r[0]}</b><small>${r[1]}</small></div></div>${state.role===r[2]?'<span class="chip good">Current</span>':'<span>›</span>'}</div>`).join("")}</div>
    <div class="section" style="padding-left:0;padding-right:0"><b>App settings</b><span>Preferences</span></div><div class="card">${[
      ["Notifications","Homework, fees & school updates"],
      ["Privacy & security","Password, OTP & device sessions"],
      ["Help & support","Contact the school office"]
    ].map(r=>`<div class="row" onclick="showDemoToast('${r[0]} opened')"><div><b>${r[0]}</b><small>${r[1]}</small></div><span>›</span></div>`).join("")}</div>
    <button class="secondary" style="width:100%;margin-top:11px" onclick="openScreen('splash')">Log out</button></div>`; }
};

function header(title,subtitle,back="home"){
  return `<div class="screen-header"><button class="back" onclick="openScreen('${back==="home"?(state.role==='student'?'home_student':state.role==='parent'?'parent_home':'teacher_home'):back}')">‹</button><div style="text-align:center"><b style="font-size:11px">${title}</b><span style="display:block;font-size:8px;color:var(--muted);margin-top:2px">${subtitle||""}</span></div><button class="icon-btn" onclick="openScreen('notifications')">•</button></div>`;
}
function footerNav(){
  if(["splash","roles","login","otp"].includes(state.screen)) return "";
  const items = nav[state.role];
  return items.map(x=>`<button class="${state.screen===x[0]?'active':''}" onclick="openScreen('${x[0]}')"><span class="bn-ic">${x[1]}</span>${x[2]}</button>`).join("");
}
function render(){
  const fn = screens[state.screen] || screens.splash;
  document.getElementById("view").innerHTML = fn();
  document.getElementById("bottomNav").innerHTML = footerNav();
  document.getElementById("demoSchool").textContent = SCHOOL_CONFIG.name;
  document.querySelectorAll("#roleTabs button").forEach(b=>b.classList.toggle("active",b.dataset.role===state.role));
  document.getElementById("statusTime").textContent = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}).replace(" AM","").replace(" PM","");
}
function openScreen(id){ state.screen=id; render(); document.getElementById("view").scrollTop=0; }
function chooseRole(role){ state.role=role; state.screen = "login"; render(); }
function completeLogin(){ state.screen = state.role==="student"?"home_student":state.role==="parent"?"parent_home":"teacher_home"; render(); showDemoToast("Signed in successfully"); }
function focusNext(i){ const e=document.getElementById("otp"+i); if(e&&e.value && i<5) document.getElementById("otp"+(i+1)).focus(); }
function showDemoToast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.style.display="block"; clearTimeout(state.toastTimer); state.toastTimer=setTimeout(()=>t.style.display="none",2200); }
function resetDemo(){ state.role="student";state.screen="splash";render(); }
function initials(x){ return x.split(" ").map(p=>p[0]).slice(0,2).join(""); }
function lessons(){ return [
  {time:"08:00–08:45",sub:"Mathematics",room:"R-101",type:"Class"},
  {time:"08:45–09:30",sub:"Science",room:"R-102",type:"Class"},
  {time:"10:15–11:00",sub:"Social Studies",room:"R-104",type:"Class"},
  {time:"11:00–11:45",sub:"Hindi",room:"R-105",type:"Class"},
  {time:"12:45–01:30",sub:"Computer",room:"R-106",type:"Lab"}
];}
function lessonHTML(x){return `<div class="lesson"><div class="lesson-time">${x.time}</div><div class="lesson-card"><b>${x.sub}</b><small>${x.room} • ${x.type}</small></div></div>`}
function homeworkRows(){return [
  {sub:"Mathematics",title:"Exercise 5.2 (Q1–10)",due:"12 Sep 2026",level:"High",status:"Pending"},
  {sub:"Science",title:"Lab report",due:"14 Sep 2026",level:"Medium",status:"Pending"},
  {sub:"English",title:"Write an essay",due:"15 Sep 2026",level:"Medium",status:"Pending"},
  {sub:"Social Studies",title:"Map Work",due:"17 Sep 2026",level:"Low",status:"Pending"},
  {sub:"Computer",title:"Practical worksheet",due:"18 Sep 2026",level:"Low",status:"Completed"}
];}
function hwCard(x){ return `<div class="assignment" style="margin-bottom:9px" data-hw="${(x.title+" "+x.sub).toLowerCase()}" onclick="openScreen('homework_detail')"><div><span class="chip blue">${x.sub}</span><b style="display:block;margin-top:6px">${x.title}</b><small>Due ${x.due} • ${x.status}</small></div><span class="chip ${x.level==='High'?'bad':x.level==='Medium'?'warn':'good'}">${x.level}</span></div>`}
function filterHomework(){const q=(document.getElementById("hwSearch")?.value||"").toLowerCase(); document.querySelectorAll("[data-hw]").forEach(e=>e.style.display=e.dataset.hw.includes(q)?"flex":"none")}
function noticeRows(){return [
  ["Holiday Announcement","26 Sep is a school holiday","Today","blue"],
  ["PTM Meeting","Parent–Teacher meeting on 21 Sep","16 Sep 2026","good"],
  ["Science Exhibition","Register by 20 Sep","15 Sep 2026","warn"],
  ["Library Update","New books added to the library","14 Sep 2026","blue"]
];}
function noticeRow(r){return `<div class="row"><div><b>${r[0]}</b><small>${r[1]}</small><small>${r[2]}</small></div><span class="chip ${r[3]}">Open</span></div>`}
function toggleAtt(i){const b=document.getElementById("att"+i); if(!b)return; const now=b.textContent.trim()==="Present"; b.textContent=now?"Absent":"Present"; b.className="chip "+(now?"bad":"good"); let p=0,a=0; document.querySelectorAll('[id^="att"]').forEach(x=>x.textContent.trim()==="Present"?p++:a++); document.getElementById("presentCount").textContent=32+p-3; document.getElementById("absentCount").textContent=3+a-2;}
function selectPayment(btn,name){btn.parentElement.querySelectorAll("button").forEach(x=>x.style.background="#fff"); btn.style.background="#f0ebff"; showDemoToast(name+" selected");}
function openComposer(){ showModal("New Message", `<div class="field"><label>Recipient</label><select class="input"><option>Class 10-A</option><option>Mr. Sharma</option><option>School Office</option></select></div><div class="field"><label>Message</label><textarea class="input" rows="4" placeholder="Write your message…"></textarea></div><button class="primary" style="width:100%" onclick="closeModal();showDemoToast('Message sent')">Send Message</button>`); }
function showModal(title,body){document.getElementById("modal").innerHTML=`<div class="sheet"><h3>${title}</h3><p>Interactive frontend demo</p>${body}<div class="sheet-actions" style="margin-top:10px"><button class="secondary" onclick="closeModal()">Close</button></div></div>`;document.getElementById("modal").style.display="flex";}
function closeModal(){document.getElementById("modal").style.display="none";}
document.getElementById("roleTabs").addEventListener("click",e=>{const b=e.target.closest("button[data-role]");if(!b)return;chooseRole(b.dataset.role);});
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});
render();
</script>
</body>
</html>
